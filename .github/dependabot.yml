# @format

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "14:00"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    assignees:
      - "lumikeiju"
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "14:00"
    cooldown:
      default-days: 3
    ignore:
      # TypeScript 6 is pinned for svelte-check's language-tools bridge;
      # type checking already runs on TS 7 via @typescript/native-preview.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"
    assignees:
      - "lumikeiju"

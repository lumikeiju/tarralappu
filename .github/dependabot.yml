# @format

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "14:00"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore"
      include: "scope"
    assignees:
      - "lumikeiju"
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "14:00"
    cooldown:
      default-days: 3
    ignore:
      # Keep TypeScript on 6 until svelte-check supports newer compiler APIs.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: "scope"
    assignees:
      - "lumikeiju"

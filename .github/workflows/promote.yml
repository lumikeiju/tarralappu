name: Promote site

on:
  workflow_dispatch:
    inputs:
      action:
        description: Create a beta candidate or promote a tested candidate to stable
        required: true
        type: choice
        options: [beta, stable]
      candidate_tag:
        description: Exact beta prerelease tag to promote (stable only)
        required: false
        type: string
      confirm_stable:
        description: I tested this exact beta candidate and authorize stable publication
        required: true
        default: false
        type: boolean

concurrency:
  group: tarralappu-site-promotion
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
    environment:
      name: ${{ inputs.action == 'stable' && 'stable' || 'beta' }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require dispatch from main
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from main."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        if: ${{ inputs.action == 'beta' }}
        with:
          bun-version-file: package.json

      - name: Install dependencies
        if: ${{ inputs.action == 'beta' }}
        run: bun install --frozen-lockfile

      - name: Validate and build beta
        if: ${{ inputs.action == 'beta' }}
        run: |
          bun format:check
          bun test
          bun run build

      - name: Package beta artifact and provenance
        id: package_beta
        if: ${{ inputs.action == 'beta' }}
        env:
          SOURCE_REF: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          version="$(jq -r '.version' package.json)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            [[ "${version%%.*}" -lt 2 ]]; then
            echo "::error::package.json version must be a stable SemVer triplet of v2.0.0 or newer."
            exit 1
          fi

          candidate_tag="v${version}-beta.${RUN_NUMBER}.${RUN_ATTEMPT}"
          asset_dir="$RUNNER_TEMP/tarralappu-beta-assets"
          mkdir -p "$asset_dir"
          touch dist/.nojekyll
          (
            cd dist
            zip -qr "$asset_dir/tarralappu-dist.zip" .
          )
          (
            cd dist
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$asset_dir/site-manifest.sha256"
          archive_sha256="$(sha256sum "$asset_dir/tarralappu-dist.zip" | awk '{print $1}')"
          site_manifest_sha256="$(sha256sum "$asset_dir/site-manifest.sha256" | awk '{print $1}')"
          (
            cd "$asset_dir"
            sha256sum tarralappu-dist.zip > tarralappu-dist.sha256
          )
          jq -n \
            --arg version "$version" \
            --arg candidateTag "$candidate_tag" \
            --arg sourceRef "$SOURCE_REF" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg archiveSha256 "$archive_sha256" \
            --arg siteManifestSha256 "$site_manifest_sha256" \
            '{
              schemaVersion: 1,
              project: "tarralappu",
              channel: "beta",
              version: $version,
              candidateTag: $candidateTag,
              sourceRef: $sourceRef,
              sourceCommit: $sourceCommit,
              runId: $runId,
              archiveSha256: $archiveSha256,
              siteManifestSha256: $siteManifestSha256,
              basePath: "/tarralappu/"
            }' > "$asset_dir/provenance.json"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=$candidate_tag" >> "$GITHUB_OUTPUT"

      - name: Create beta prerelease
        if: ${{ inputs.action == 'beta' }}
        env:
          CANDIDATE_TAG: ${{ steps.package_beta.outputs.candidate_tag }}
          VERSION: ${{ steps.package_beta.outputs.version }}
        run: |
          gh release create "$CANDIDATE_TAG" \
            "$RUNNER_TEMP/tarralappu-beta-assets/tarralappu-dist.zip" \
            "$RUNNER_TEMP/tarralappu-beta-assets/tarralappu-dist.sha256" \
            "$RUNNER_TEMP/tarralappu-beta-assets/site-manifest.sha256" \
            "$RUNNER_TEMP/tarralappu-beta-assets/provenance.json" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "Tarralappu v${VERSION} (beta)" \
            --notes "Beta site artifact built from main at ${GITHUB_SHA}. The attached ZIP contains only static build output."

      - name: Download and verify beta candidate
        id: verify_candidate
        if: ${{ inputs.action == 'stable' }}
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          CONFIRM_STABLE: ${{ inputs.confirm_stable }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_STABLE" != "true" ]]; then
            echo "::error::Stable promotion requires explicit confirmation."
            exit 1
          fi
          if [[ ! "$CANDIDATE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+\.[0-9]+$ ]] ||
            ! git check-ref-format "refs/tags/$CANDIDATE_TAG"; then
            echo "::error::Enter a valid beta candidate tag created by this workflow."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pages" | jq -e '
            .build_type == "legacy" and
            .source.branch == "stable" and
            .source.path == "/"
          ' > /dev/null || {
            echo "::error::Configure GitHub Pages to deploy from stable / (root) before promotion."
            exit 1
          }

          is_prerelease="$(gh release view "$CANDIDATE_TAG" \
            --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          if [[ "$is_prerelease" != "true" ]]; then
            echo "::error::The selected candidate is not a GitHub prerelease."
            exit 1
          fi

          asset_dir="$RUNNER_TEMP/tarralappu-beta-assets"
          mkdir -p "$asset_dir"
          gh release download "$CANDIDATE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "tarralappu-dist.zip" \
            --pattern "tarralappu-dist.sha256" \
            --pattern "site-manifest.sha256" \
            --pattern "provenance.json" \
            --dir "$asset_dir"
          (
            cd "$asset_dir"
            sha256sum --check tarralappu-dist.sha256
          )
          archive_sha256="$(sha256sum "$asset_dir/tarralappu-dist.zip" | awk '{print $1}')"
          site_manifest_sha256="$(sha256sum "$asset_dir/site-manifest.sha256" | awk '{print $1}')"
          jq -e \
            --arg candidateTag "$CANDIDATE_TAG" \
            --arg archiveSha256 "$archive_sha256" \
            --arg siteManifestSha256 "$site_manifest_sha256" '
            .schemaVersion == 1 and
            .project == "tarralappu" and
            .channel == "beta" and
            .candidateTag == $candidateTag and
            .sourceRef == "main" and
            .basePath == "/tarralappu/" and
            (.sourceCommit | test("^[a-f0-9]{40}$")) and
            .archiveSha256 == $archiveSha256 and
            .siteManifestSha256 == $siteManifestSha256
          ' "$asset_dir/provenance.json" > /dev/null

          version="$(jq -r '.version' "$asset_dir/provenance.json")"
          source_commit="$(jq -r '.sourceCommit' "$asset_dir/provenance.json")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            [[ "${version%%.*}" -lt 2 ]] ||
            [[ "$CANDIDATE_TAG" != "v${version}-beta."* ]]; then
            echo "::error::Candidate provenance contains an invalid or mismatched stable version."
            exit 1
          fi
          git fetch origin "refs/tags/${CANDIDATE_TAG}:refs/tags/${CANDIDATE_TAG}"
          tagged_commit="$(git rev-parse "${CANDIDATE_TAG}^{commit}")"
          if [[ "$tagged_commit" != "$source_commit" ]]; then
            echo "::error::Candidate provenance does not match its source tag."
            exit 1
          fi

          stable_tag="v${version}"
          existing_tag="$(git ls-remote --refs origin "refs/tags/${stable_tag}")"
          if [[ -n "$existing_tag" ]]; then
            echo "::error::Stable tag ${stable_tag} already exists; refusing to replace it."
            exit 1
          fi

          site_dir="$RUNNER_TEMP/tarralappu-site-output"
          mkdir -p "$site_dir"
          python - "$asset_dir/tarralappu-dist.zip" "$site_dir" <<'PY'
          import pathlib
          import sys
          import zipfile

          archive_path = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2]).resolve()
          with zipfile.ZipFile(archive_path) as archive:
              for entry in archive.infolist():
                  target = (destination / entry.filename).resolve()
                  if target != destination and destination not in target.parents:
                      raise SystemExit("Candidate archive contains an unsafe path.")
              archive.extractall(destination)
          PY
          if [[ ! -f "$site_dir/index.html" || ! -f "$site_dir/.nojekyll" ]]; then
            echo "::error::Candidate archive is missing required static site files."
            exit 1
          fi
          extracted_manifest="$RUNNER_TEMP/tarralappu-extracted-manifest.sha256"
          (
            cd "$site_dir"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$extracted_manifest"
          if ! cmp -s "$asset_dir/site-manifest.sha256" "$extracted_manifest"; then
            echo "::error::Candidate archive contents do not match its site manifest."
            exit 1
          fi

          beta_dir="$RUNNER_TEMP/tarralappu-beta-branch"
          mkdir -p "$beta_dir"
          git fetch origin "+refs/heads/beta:refs/remotes/origin/beta"
          git archive refs/remotes/origin/beta | tar -xf - -C "$beta_dir"
          beta_manifest="$RUNNER_TEMP/tarralappu-beta-branch-manifest.sha256"
          (
            cd "$beta_dir"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$beta_manifest"
          if ! cmp -s "$asset_dir/site-manifest.sha256" "$beta_manifest"; then
            echo "::error::The beta branch content differs from the selected candidate."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "stable_tag=$stable_tag" >> "$GITHUB_OUTPUT"

      - name: Publish artifact-only branch
        id: publish_branch
        env:
          TARGET_BRANCH: ${{ inputs.action }}
          CANDIDATE_TAG: ${{ inputs.action == 'beta' && steps.package_beta.outputs.candidate_tag || inputs.candidate_tag }}
          SOURCE_COMMIT: ${{ inputs.action == 'beta' && github.sha || steps.verify_candidate.outputs.source_commit }}
        run: |
          set -euo pipefail
          case "$TARGET_BRANCH" in
            beta)
              site_source="dist"
              ;;
            stable)
              site_source="$RUNNER_TEMP/tarralappu-site-output"
              ;;
            *)
              echo "::error::Unsupported deployment branch."
              exit 1
              ;;
          esac

          publish_dir="$(mktemp -d "$RUNNER_TEMP/tarralappu-${TARGET_BRANCH}.XXXXXX")"
          cp -a "$site_source/." "$publish_dir/"
          touch "$publish_dir/.nojekyll"
          git -C "$publish_dir" init --initial-branch="$TARGET_BRANCH"
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add --all
          git -C "$publish_dir" commit -m "Deploy ${TARGET_BRANCH} from ${CANDIDATE_TAG} (${SOURCE_COMMIT})"
          git -C "$publish_dir" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)"
          expected_commit="$(git -C "$publish_dir" -c "http.extraheader=${auth_header}" \
            ls-remote --heads origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          git -C "$publish_dir" \
            -c "http.extraheader=${auth_header}" \
            push --force-with-lease="refs/heads/${TARGET_BRANCH}:${expected_commit}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "deployment_commit=$(git -C "$publish_dir" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify promoted branch content
        env:
          TARGET_BRANCH: ${{ inputs.action }}
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/tarralappu-verified-${TARGET_BRANCH}"
          mkdir -p "$output_dir"
          git fetch origin "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          git archive "refs/remotes/origin/${TARGET_BRANCH}" | tar -xf - -C "$output_dir"
          branch_manifest="$RUNNER_TEMP/tarralappu-${TARGET_BRANCH}-branch-manifest.sha256"
          (
            cd "$output_dir"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > "$branch_manifest"
          if ! cmp -s \
            "$RUNNER_TEMP/tarralappu-beta-assets/site-manifest.sha256" \
            "$branch_manifest"; then
            echo "::error::${TARGET_BRANCH} branch content does not match the verified candidate."
            exit 1
          fi

      - name: Build stable GitHub Pages site
        if: ${{ inputs.action == 'stable' }}
        env:
          DEPLOYMENT_COMMIT: ${{ steps.publish_branch.outputs.deployment_commit }}
        run: |
          set -euo pipefail
          build_url="$(gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq .url)"
          for attempt in {1..60}; do
            build="$(gh api "$build_url")"
            status="$(jq -r '.status' <<< "$build")"
            if [[ "$status" == "built" ]]; then
              if [[ "$(jq -r '.commit' <<< "$build")" != "$DEPLOYMENT_COMMIT" ]]; then
                echo "::error::Pages built a different stable commit."
                exit 1
              fi
              echo "Published stable commit $DEPLOYMENT_COMMIT." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$status" == "errored" ]]; then
              echo "::error::$(jq -r '.error.message' <<< "$build")"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for the stable Pages build."
          exit 1

      - name: Publish stable GitHub release
        if: ${{ inputs.action == 'stable' }}
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          STABLE_TAG: ${{ steps.verify_candidate.outputs.stable_tag }}
          SOURCE_COMMIT: ${{ steps.verify_candidate.outputs.source_commit }}
          VERSION: ${{ steps.verify_candidate.outputs.version }}
        run: |
          gh release create "$STABLE_TAG" \
            "$RUNNER_TEMP/tarralappu-beta-assets/tarralappu-dist.zip" \
            "$RUNNER_TEMP/tarralappu-beta-assets/tarralappu-dist.sha256" \
            "$RUNNER_TEMP/tarralappu-beta-assets/site-manifest.sha256" \
            "$RUNNER_TEMP/tarralappu-beta-assets/provenance.json" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_COMMIT" \
            --latest \
            --title "Tarralappu v${VERSION}" \
            --notes "Promotes the tested beta candidate ${CANDIDATE_TAG} from ${SOURCE_COMMIT}."
